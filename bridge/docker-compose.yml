services:
  bridge:
    build: .
    container_name: qwenpaw-bridge
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-5000}:5000"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=5000
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:?Set BRIDGE_API_KEY before starting the container}
      - BRIDGE_CORS_ORIGINS=${BRIDGE_CORS_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
